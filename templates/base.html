{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ theme_mode|default:'dark' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{% block title %}Authentication Platform{% endblock %}</title>
  {% block meta_robots %}
  <meta name="robots" content="noindex, nofollow">
  {% endblock %}
  {% block meta_description %}{% endblock %}

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'accounts/css/auth_tokens.css' %}">
  {% block extra_css %}{% endblock %}
  {% if dynamic_css_vars %}
  <style id="dynamic-theme-vars">
    :root {
      {{ dynamic_css_vars|safe }}
    }
  </style>
  {% endif %}
  <script>
    (function() {
      // Set system preference class if in system mode
      function checkSystemTheme() {
        var theme = document.documentElement.getAttribute('data-theme');
        if (theme === 'system') {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('system-dark', isDark);
          document.documentElement.classList.toggle('system-light', !isDark);
        } else {
          document.documentElement.classList.remove('system-dark', 'system-light');
        }
      }
      checkSystemTheme();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', checkSystemTheme);
      }

      if (window.self !== window.top || new URLSearchParams(window.location.search).has('preview')) {
        document.documentElement.classList.add('is-preview');
        document.addEventListener('DOMContentLoaded', function() {
          if (document.body) document.body.classList.add('is-preview');
        });
      }
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %} {% if request.GET.preview %}is-preview{% endif %} density-{{ spacing.density|default:'comfortable' }} type-scale-{{ typography.scale|default:'modern' }}" data-theme="{{ theme_mode|default:'dark' }}">
  <div class="auth-bg-filter-layer" aria-hidden="true"></div>
  <div class="auth-bg-overlay" aria-hidden="true"></div>
  {% block content %}{% endblock %}
  <script src="{% static 'accounts/js/auth_common.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
