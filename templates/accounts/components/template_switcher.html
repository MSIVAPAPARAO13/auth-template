{% comment %}
Shared Template Switcher Toolbar (Development & Demonstration Utility)
Allows testing and previewing all templates dynamically without code changes.
{% endcomment %}
<nav class="floating-template-switcher" aria-label="Template switcher">
  <span class="switcher-label">Style:</span>
  <a href="?template=modern" class="switcher-btn {% if active_template == 'modern' or not active_template %}active{% endif %}" title="Modern Minimal (dark)">Modern</a>
  <a href="?template=split" class="switcher-btn {% if active_template == 'split' %}active{% endif %}" title="Split Screen Editorial">Split</a>
  <a href="?template=corporate" class="switcher-btn {% if active_template == 'corporate' %}active{% endif %}" title="Corporate Light">Corporate</a>
  <a href="{% url 'templates' %}" class="switcher-btn switcher-btn-all" title="View all template designs">All</a>
</nav>
