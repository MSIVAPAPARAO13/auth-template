{% comment %}
Shared 6-Digit OTP Input Component
Includes 6 individual auto-advancing digit inputs, paste handling support, and hidden aggregate field.
{% endcomment %}
<div class="otp-digit-group" id="otp-inputs" role="group" aria-label="6-digit verification code">
  <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" data-index="0" aria-label="Digit 1" autocomplete="one-time-code" required>
  <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" data-index="1" aria-label="Digit 2" required>
  <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" data-index="2" aria-label="Digit 3" required>
  <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" data-index="3" aria-label="Digit 4" required>
  <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" data-index="4" aria-label="Digit 5" required>
  <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" data-index="5" aria-label="Digit 6" required>
</div>
<input type="hidden" name="otp_code" id="otp-code-hidden" value="">
