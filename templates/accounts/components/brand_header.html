{% comment %}
Shared Brand Header Component
Expects: header_title, header_subtitle
{% endcomment %}
<div class="auth-header">
  <div class="brand-header-logo-container align-{{ branding.logo_align|default:'center' }}" id="brand-header-container">
    <img src="{{ branding.logo_url|default:'' }}"
         alt="{{ branding.brand_name|default:'Platform' }} Logo"
         class="brand-custom-logo"
         id="brand-header-logo"
         style="{% if not branding.logo_url %}display: none;{% endif %} max-width: calc(var(--logo-width, 120px) * var(--logo-scale, 1)); max-height: calc(var(--logo-height, 36px) * var(--logo-scale, 1)); object-fit: var(--logo-object-fit, contain);">
    <div class="brand-badge brand-default-badge" id="brand-header-default-badge" aria-hidden="true" style="{% if branding.logo_url %}display: none;{% endif %}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
  </div>
  <div class="brand-name-container align-{{ branding.logo_align|default:'center' }}" id="brand-name-container"{% if not branding.brand_name %} style="display: none;"{% endif %}>
    <span class="brand-name" id="brand-header-name">{{ branding.brand_name|default:"Auth Platform" }}</span>
  </div>
  <h1 class="auth-title">{{ header_title|default:"Welcome Back" }}</h1>
  <p class="auth-subtitle">{{ header_subtitle|default:"Sign in to access your platform account" }}</p>
</div>
